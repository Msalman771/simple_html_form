<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Document</title>
    <style>
        .container{
            display: grid;
            background-color: #030303;
           grid-template-rows:1fr 3fr 1fr;
            border: 1px solid black;         
           grid-template-areas:
                "header header"
                "main article"
                "footer footer";
                gap:2px;
                height: 100vh;
        }
        .item{
            background-color: rgba(159, 45, 45, 0.8);
            border: 1px solid black;
      
           
        }
        .item1{
            display: flex;
            justify-content: center;
            align-items: center;
           gap: 30px;
            text-align: center;
            align-content: center;
            grid-area: header;
            background-color: #1E3A5F;
          
           
        }
        .item1 a{
            text-decoration: none;
              color: white;
        }
        .item2{
            grid-area: main;
            background-color: #FFFFFF;
            align-content: center;
            text-align: center;

        }
        .item3{
            grid-area: article;
            background-color: #E8F1F8;
            align-content: center;
            text-align: center;
        }
        .item4{
            grid-area: footer;
            background-color: #172B4D;
            align-content: center;
            color:white;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item item1">
            <a href="#">Home</a>
            <a href="#">About</a>
              <a href="#">Home</a>
            <a href="#">About</a>
        </div>
        <div class="item item2">Main content</div>
        <div class="item item3">Article content</div>
        <div class="item item4">Footer section</div>
    </div>
</body>
</html>
