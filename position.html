<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }

        .box{
            width: 50%;
            border: 2px solid black;
            margin: 20px;
            padding: 10px;      
          }
          .parent{
         
            border: 2px solid purple;
            
            
          }
        .box1{
            background-color: #00ffff;
            position: sticky;
            top: 0px;
          left: 0px;
        
        }
        .box2{
            background-color: bisque;
      
        
        }
        .box3{
            background-color: aquamarine;
          
          
        }
        .box4{
            background-color: blueviolet;
            position: fixed;
            bottom: 0px;
            right: 0px;
            
        }
        .over{
            border: 2px solid black;
            width: 50px;
            overflow-x: hidden;
            height: 100px;
        }
    </style>
</head>
<body>
    <div class="parent">
    <div class="box box1">this one is sticky</div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <div class="box box4">this one is fixed</div>

    <p>overflow</p>
    <div class="over">
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Velit cumque laudantium totam deleniti magnam, recusandae sint iusto? Blanditiis officia maiores praesentium ad, reiciendis obcaecati, accusantium pariatur at qui, vitae non!</p>
    </div>
</div>
</body>
</html>
