<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }

        .box{
            width: 50%;
            height: 50vh;
            border: 2px solid black;
            margin: 20px;
            padding: 10px;      
          }
          .parent{
         
            border: 2px solid purple;
            
          }
        .box1{
            background-color: aqua;
          
        }
        .box2{
            background-color: bisque;
            position:sticky;
            top: 30px;
            height: 60px;
          
       
        }
        .box3{
            background-color: aquamarine;
            height: 600px;
          
        }
        .box4{
            background-color: blueviolet;
    position:fixed;
         right: 20px;
         bottom: 20px;
         height: 50px;
        }
    </style>
</head>
<body>
    <div class="parent">
    <div class="box box1">this one is sticky</div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <div class="box box4">this one is fixed</div>
    </div>
</body>
</html>
